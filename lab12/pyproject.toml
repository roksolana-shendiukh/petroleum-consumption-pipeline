[project]
name = "lab12_rag_pipeline"
version = "0.0.8"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "langchain-text-splitters>=0.3",
    "databricks-ai-search",
]

[project.scripts]
setup_tables = "setup_tables:main"
ingest_raw = "ingest_raw:main"
parse_documents = "parse_documents:main"
chunk_documents = "chunk_documents:main"
embed_chunks = "embed_chunks:main"
load_eval_questions = "load_eval_questions:main"
create_search = "create_search:main"
delete_search = "delete_search:main"
evaluate_retrieval = "evaluate_retrieval:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "databricks-connect>=17.3,<17.4",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/eia_ingest",
    "src/eia_parse",
    "src/eia_chunk",
    "src/eia_embed",
    "src/eia_eval",
    "src/eia_search",
    "src/eia_retrieval",
    "src/lab12_tables",
]

[tool.hatch.build.targets.wheel.force-include]
"src/setup_tables.py" = "setup_tables.py"
"src/ingest_raw.py" = "ingest_raw.py"
"src/parse_documents.py" = "parse_documents.py"
"src/chunk_documents.py" = "chunk_documents.py"
"src/embed_chunks.py" = "embed_chunks.py"
"src/load_eval_questions.py" = "load_eval_questions.py"
"src/create_search.py" = "create_search.py"
"src/delete_search.py" = "delete_search.py"
"src/evaluate_retrieval.py" = "evaluate_retrieval.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
[project]
name = "lab12_rag_pipeline"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
]

[project.scripts]
ingest_raw = "ingest_raw:main"
parse_documents = "parse_documents:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "databricks-connect>=17.3,<17.4",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eia_ingest", "src/eia_parse"]

[tool.hatch.build.targets.wheel.force-include]
"src/ingest_raw.py" = "ingest_raw.py"
"src/parse_documents.py" = "parse_documents.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
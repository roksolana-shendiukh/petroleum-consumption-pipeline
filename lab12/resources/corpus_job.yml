resources:
  jobs:
    lab12_corpus_job:
      name: lab12-corpus
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - roksolana.shendiu770@softserve.academy
      environments:
        - environment_key: lab12_env
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: ingest_raw
          max_retries: 1
          timeout_seconds: 3600
          python_wheel_task:
            package_name: lab12_rag_pipeline
            entry_point: ingest_raw
            parameters:
              - --config
              - ${workspace.file_path}/config/ingest_raw.json
              - --tables-config
              - ${workspace.file_path}/config/tables.json
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          existing_cluster_id: 0828-065013-gln8ogbm
          libraries:
            - whl: /Workspace/Users/roksolana.shendiu770@softserve.academy/.bundle/lab12_rag/dev/artifacts/.internal/lab12_rag_pipeline-0.0.1-py3-none-any.whl
        - task_key: parse_documents
          depends_on:
            - task_key: ingest_raw
          timeout_seconds: 1800
          python_wheel_task:
            package_name: lab12_rag_pipeline
            entry_point: parse_documents
            parameters:
              - --config
              - ${workspace.file_path}/config/parse_documents.json
              - --tables-config
              - ${workspace.file_path}/config/tables.json
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          existing_cluster_id: 0828-065013-gln8ogbm
          libraries:
            - whl: /Workspace/Users/roksolana.shendiu770@softserve.academy/.bundle/lab12_rag/dev/artifacts/.internal/lab12_rag_pipeline-0.0.1-py3-none-any.whl

resources:
  jobs:
    lab12_embed_job:
      name: lab12-embed
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - roksolana.shendiu770@softserve.academy
      environments:
        - environment_key: lab12_env
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: embed_chunks
          environment_key: lab12_env
          timeout_seconds: 1800
          python_wheel_task:
            package_name: lab12_rag_pipeline
            entry_point: embed_chunks
            parameters:
              - --config
              - ${workspace.file_path}/config/embed_chunks.json
              - --tables-config
              - ${workspace.file_path}/config/tables.json
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
resources:
  jobs:
    lab12_setup_job:
      name: lab12-setup
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - roksolana.shendiu770@softserve.academy
      environments:
        - environment_key: lab12_env
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: setup_tables
          timeout_seconds: 600
          python_wheel_task:
            package_name: lab12_rag_pipeline
            entry_point: setup_tables
            parameters:
              - --tables-config
              - ${workspace.file_path}/config/tables.json
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          existing_cluster_id: 0828-065013-gln8ogbm
          libraries:
            - whl: /Workspace/Users/roksolana.shendiu770@softserve.academy/.bundle/lab12_rag/dev/artifacts/.internal/lab12_rag_pipeline-0.0.1-py3-none-any.whl

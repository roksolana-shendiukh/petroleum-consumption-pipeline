resources:
  jobs:
    lab12_search_create_job:
      name: lab12-search-create
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - roksolana.shendiu770@softserve.academy
      environments:
        - environment_key: lab12_env
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: create_search
          environment_key: lab12_env
          timeout_seconds: 3600
          python_wheel_task:
            package_name: lab12_rag_pipeline
            entry_point: create_search
            parameters:
              - --config
              - ${workspace.file_path}/config/search_index.json
              - --embed-config
              - ${workspace.file_path}/config/embed_chunks.json
              - --tables-config
              - ${workspace.file_path}/config/tables.json
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}

    lab12_search_delete_job:
      name: lab12-search-delete
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - roksolana.shendiu770@softserve.academy
      environments:
        - environment_key: lab12_env
          spec:
            environment_version: "3"
            dependencies:
              - ../dist/*.whl
      tasks:
        - task_key: delete_search
          environment_key: lab12_env
          timeout_seconds: 1800
          python_wheel_task:
            package_name: lab12_rag_pipeline
            entry_point: delete_search
            parameters:
              - --config
              - ${workspace.file_path}/config/search_index.json
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
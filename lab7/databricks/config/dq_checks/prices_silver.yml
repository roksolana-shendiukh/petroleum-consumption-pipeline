- name: price_sk is null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: price_sk
- name: series_bk is null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: series_bk
- name: effective_from is null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: effective_from
- name: "price not in {{ price_min }}..{{ price_max }}"
  criticality: error
  check:
    function: is_in_range
    arguments:
      column: price
      min_limit: "{{ price_min }}"
      max_limit: "{{ price_max }}"
- name: duplicate key (series_bk, effective_from)
  criticality: error
  check:
    function: is_unique
    arguments:
      columns:
        - series_bk
        - effective_from
- name: is_current does not match effective_to
  criticality: error
  user_metadata:
    dimension: consistency
  check:
    function: sql_expression
    arguments:
      expression: "(is_current = true AND effective_to IS NULL) OR (is_current = false AND effective_to IS NOT NULL)"
      msg: is_current must be true exactly when effective_to is empty
      columns:
        - is_current
        - effective_to
- name: effective_to is not after effective_from
  criticality: error
  user_metadata:
    dimension: consistency
  check:
    function: sql_expression
    arguments:
      expression: "effective_to IS NULL OR effective_to > effective_from"
      msg: effective_to must be later than effective_from
      columns:
        - effective_to
        - effective_from
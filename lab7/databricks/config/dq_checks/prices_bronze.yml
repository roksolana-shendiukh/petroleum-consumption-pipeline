- name: series is null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: series
- name: period is null
  criticality: error
  check:
    function: is_not_null
    arguments:
      column: period
- name: period is not a valid date
  criticality: error
  check:
    function: is_valid_date
    arguments:
      column: period
      date_format: yyyy-MM-dd
- name: value is not a positive number
  criticality: error
  user_metadata:
    dimension: validity
  check:
    function: sql_expression
    arguments:
      expression: "COALESCE(try_cast(`value` AS DECIMAL(10,3)) > 0, false)"
      msg: value must be a number greater than zero
      columns:
        - value
bundle:
  name: petroleum_lab7

variables:
  cluster_id:
    description: Existing cluster used to run the tests and notebooks
    default: 0828-065013-gln8ogbm

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net

resources:
  jobs:
    unit_tests:
      name: petroleum-unit-tests
      tasks:
        - task_key: pytest
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: tests/run_tests.py
            parameters:
              - ${workspace.file_path}
          libraries:
            - pypi:
                package: pytest
            - pypi:
                package: tenacity
            - pypi:
                package: databricks-labs-dqx

    dq_suite:
      name: petroleum-dq-suite
      max_concurrent_runs: 1
      tasks:
        - task_key: row_checks
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: notebooks/01_dq_row_checks.py
            base_parameters:
              environment: dev
              config_path: ${workspace.file_path}/config/pipeline_config.yaml
              src_path: ${workspace.file_path}/src
              run_id: "{{job.run_id}}"

        - task_key: table_checks
          depends_on:
            - task_key: row_checks
          run_if: ALL_DONE
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: notebooks/02_dq_table_checks.py
            base_parameters:
              environment: dev
              config_path: ${workspace.file_path}/config/pipeline_config.yaml
              src_path: ${workspace.file_path}/src
              run_id: "{{job.run_id}}"
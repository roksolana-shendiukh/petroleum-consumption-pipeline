bundle:
  name: petroleum_lab7

variables:
  cluster_id:
    description: Existing cluster used to run the tests and notebooks
    default: 0828-065013-gln8ogbm

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405604651938730.10.azuredatabricks.net

resources:
  jobs:
    unit_tests:
      name: petroleum-unit-tests
      tasks:
        - task_key: pytest
          existing_cluster_id: ${var.cluster_id}
          spark_python_task:
            python_file: tests/run_tests.py
            parameters:
              - ${workspace.file_path}
          libraries:
            - pypi:
                package: pytest
            - pypi:
                package: tenacity

    gold_facts_weekly:
      name: gold-facts-weekly
      tasks:
        - task_key: gold_facts_weekly
          existing_cluster_id: ${var.cluster_id}
          notebook_task:
            notebook_path: notebooks/gold_facts_weekly.py
            base_parameters:
              environment: dev
              config_path: ${workspace.file_path}/config/pipeline_config.yaml
              src_path: ${workspace.file_path}/src
          libraries:
            - pypi:
                package: tenacity
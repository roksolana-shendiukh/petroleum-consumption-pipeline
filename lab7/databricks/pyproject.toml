[project]
name = "petroleum-transformations"
version = "0.0.1"
authors = [{ name = "roksolana.shendiu770@softserve.academy" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml",
    "requests",
    "tenacity",
    "databricks-labs-dqx==0.16.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-connect>=17.3,<17.4",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petroleum_transformations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
name: deploy-prod

on:
  push:
    branches: [main]
    paths:
      - "lab8/petroleum_pipeline/**"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Backfill start date (YYYY-MM-DD). Leave empty for the usual last-30-days run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
  DATABRICKS_AUTH_TYPE: oauth-m2m

defaults:
  run:
    working-directory: lab8/petroleum_pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: databricks/setup-cli@main
        with:
          version: 1.19.0

      - name: Tie the wheel version to the commit
        run: sed -i "s/^version = .*/version = \"0.0.1+${GITHUB_SHA::7}\"/" pyproject.toml

      - name: Validate
        run: databricks bundle validate -t prod

      - name: Deploy
        run: databricks bundle deploy -t prod

      - name: Run the ETL job and report its status
        timeout-minutes: 150
        working-directory: .
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          START_DATE: ${{ inputs.start_date }}
        run: |
          args=(run-job --job-name petroleum-etl)
          if [ -n "${START_DATE}" ]; then
            args+=(--param "start_date=${START_DATE}")
          fi
          uv run --no-project --with "databricks-sdk==0.147.0" python lab9/cli.py "${args[@]}"

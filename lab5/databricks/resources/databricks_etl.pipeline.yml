resources:
  pipelines:
    databricks_etl:
      name: databricks_etl
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      root_path: "../src/databricks_etl"

      configuration:
        wikipedia.eh_namespace: "evhua5816bd"
        wikipedia.eh_name: "roksolana-wikipedia-recentchange"
        wikipedia.secret_scope: "eventhub"
        wikipedia.secret_key: "eh-connection-string"
        wikipedia.starting_offsets: "earliest"
        wikipedia.max_offsets_per_trigger: "50000"
        petroleum.consumption_path: "${var.raw_volume_path}/consumption"
        petroleum.consumption_schema_location: "${var.raw_volume_path}/_schemas/consumption"
        petroleum.prices_path: "${var.raw_volume_path}/prices"
        petroleum.prices_schema_location: "${var.raw_volume_path}/_schemas/prices"

      libraries:
        - glob:
            include: ../src/databricks_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
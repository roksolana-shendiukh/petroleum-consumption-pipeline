resources:
  pipelines:
    databricks_etl:
      name: databricks_etl
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      root_path: "../src/databricks_etl"

      libraries:
        - glob:
            include: ../src/databricks_etl/transformations/**

      environment:
        dependencies:
          - --editable ${workspace.file_path}
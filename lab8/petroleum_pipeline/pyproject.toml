[project]
name = "petroleum-transformations"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "httpx",
    "tenacity",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "databricks-connect>=17.3,<17.4",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petroleum_transformations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
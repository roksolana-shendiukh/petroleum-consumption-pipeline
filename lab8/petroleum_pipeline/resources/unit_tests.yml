resources:
  jobs:
    unit_tests:
      name: petroleum-unit-tests
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - pytest
              - pyyaml
              - httpx
              - tenacity
      tasks:
        - task_key: pytest
          spark_python_task:
            python_file: ../tests/run_tests.py
            parameters:
              - ${workspace.file_path}
          existing_cluster_id: 0924-102324-wnx9xwo2
          libraries:
            - pypi:
                package: pytest
            - pypi:
                package: pyyaml
            - pypi:
                package: httpx
            - pypi:
                package: tenacity
